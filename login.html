<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | OUTFIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="inner header__row">
      <h1><a href="index.html" class="logo">OUTFIT</a></h1>
      <nav class="header__util">
        <a href="index.html">쇼핑 계속하기</a>
      </nav>
    </div>
  </header>

  <main class="auth">
    <div class="tabs" role="tablist">
      <button type="button" class="tab is-active" data-tab="login" role="tab">로그인</button>
      <button type="button" class="tab" data-tab="signup" role="tab">회원가입</button>
    </div>

    <form class="auth__form" data-form="login" novalidate>
      <div class="field">
        <label for="loginEmail">이메일</label>
        <input id="loginEmail" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="loginPassword">비밀번호</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--black">로그인</button>
      <p class="notice">로그인하지 않아도 주문할 수 있어요. 다만 비회원 주문은 마이페이지에서 볼 수 없어요.</p>
    </form>

    <form class="auth__form" data-form="signup" novalidate hidden>
      <div class="field">
        <label for="signupName">이름</label>
        <input id="signupName" type="text" autocomplete="name" maxlength="30" required>
      </div>
      <div class="field">
        <label for="signupEmail">이메일</label>
        <input id="signupEmail" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="signupPassword">비밀번호 (6자 이상)</label>
        <input id="signupPassword" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="field">
        <label for="signupPassword2">비밀번호 확인</label>
        <input id="signupPassword2" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn--black">가입하기</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/db.js"></script>
  <script src="js/cart.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      // 같은 사이트 안의 페이지로만 돌아가기
      const next = /^[\w-]+\.html(\?[\w=&%.-]*)?$/.test(params.get('next') || '') ? params.get('next') : 'index.html';
      const $ = id => document.getElementById(id);

      if (await Auth.ready) return location.replace(next);

      document.querySelector('.tabs').addEventListener('click', e => {
        const tab = e.target.closest('.tab');
        if (!tab) return;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('is-active', t === tab));
        document.querySelectorAll('.auth__form').forEach(f => (f.hidden = f.dataset.form !== tab.dataset.tab));
      });
      if (params.get('tab') === 'signup') document.querySelector('[data-tab="signup"]').click();

      const ERRORS = {
        invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
        email_not_confirmed: '이메일 인증이 끝나지 않았습니다. 메일함을 확인해 주세요.',
        user_already_exists: '이미 가입된 이메일입니다. 로그인해 주세요.',
        weak_password: '비밀번호가 너무 쉽습니다. 6자 이상으로 다시 입력해 주세요.',
        over_email_send_rate_limit: '잠시 후 다시 시도해 주세요. (메일 발송 제한)',
        email_address_invalid: '사용할 수 없는 이메일 주소입니다.'
      };
      const errorText = err => ERRORS[err.code] || err.message || '잠시 후 다시 시도해 주세요.';

      document.querySelector('[data-form="login"]').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const email = $('loginEmail').value.trim();
        const password = $('loginPassword').value;
        if (!email || !password) return toast('이메일과 비밀번호를 입력해 주세요.');
        btn.disabled = true;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        btn.disabled = false;
        if (error) return toast(errorText(error));
        location.replace(next);
      });

      document.querySelector('[data-form="signup"]').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const name = $('signupName').value.trim();
        const email = $('signupEmail').value.trim();
        const password = $('signupPassword').value;
        if (!name) return toast('이름을 입력해 주세요.');
        if (!/^\S+@\S+\.\S+$/.test(email)) return toast('이메일을 확인해 주세요.');
        if (password.length < 6) return toast('비밀번호는 6자 이상이어야 합니다.');
        if (password !== $('signupPassword2').value) return toast('비밀번호가 서로 다릅니다.');
        btn.disabled = true;
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
        btn.disabled = false;
        if (error) return toast(errorText(error));
        if (!data.session) {
          // 이메일 인증이 켜져 있는 경우
          if (data.user && data.user.identities && !data.user.identities.length) {
            return toast('이미 가입된 이메일입니다. 로그인해 주세요.');
          }
          alert('가입 확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인해 주세요.');
          return document.querySelector('[data-tab="login"]').click();
        }
        location.replace(next);
      });
    })();
  </script>
</body>
</html>
