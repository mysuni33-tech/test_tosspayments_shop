<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 완료 | OUTFIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="inner header__row">
      <h1><a href="index.html" class="logo">OUTFIT</a></h1>
    </div>
  </header>

  <main class="result">
    <div class="result__icon">…</div>
    <h1 class="r-title">결제를 승인하는 중입니다</h1>
    <p class="result__msg">잠시만 기다려 주세요.</p>
    <dl hidden>
      <div><dt>주문번호</dt><dd class="r-order">-</dd></div>
      <div><dt>상품</dt><dd class="r-name">-</dd></div>
      <div><dt>결제수단</dt><dd class="r-method">-</dd></div>
      <div><dt>결제금액</dt><dd class="r-amount">-</dd></div>
      <div><dt>승인일시</dt><dd class="r-date">-</dd></div>
      <div class="r-receipt-row" hidden><dt>영수증</dt><dd><a class="r-receipt link" target="_blank" rel="noopener">영수증 보기</a></dd></div>
    </dl>
    <div class="result__btns" hidden>
      <a href="mypage.html" class="btn btn--black r-mypage" hidden>주문 내역 보기</a>
      <a href="index.html" class="btn">쇼핑 계속하기</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/db.js"></script>
  <script src="js/cart.js"></script>
  <script>
    /*
      결제 인증 성공 후 이동하는 페이지입니다.
      받은 paymentKey, orderId, amount를 서버(/api/confirm)로 보내면
      서버가 금액을 검증하고 재고를 차감한 뒤 시크릿 키로 토스페이먼츠 결제 승인 API를 호출합니다.
      새로고침해도 서버가 이미 승인된 주문은 다시 처리하지 않고 저장된 결과를 돌려줍니다.
    */
    (async function () {
      const params = new URLSearchParams(location.search);
      const orderId = params.get('orderId');
      let pending = null;
      try {
        pending = JSON.parse(sessionStorage.getItem('outfit_pending'));
      } catch (e) {}

      function fail(code, message) {
        location.replace(
          'fail.html?code=' + encodeURIComponent(code) +
          '&message=' + encodeURIComponent(message) +
          '&orderId=' + encodeURIComponent(orderId || '')
        );
      }

      if (!orderId || !params.get('paymentKey')) {
        return fail('INVALID_ORDER', '주문 정보가 올바르지 않습니다.');
      }

      let payment;
      try {
        payment = await api('/api/confirm', {
          paymentKey: params.get('paymentKey'),
          orderId,
          amount: Number(params.get('amount'))
        });
      } catch (err) {
        return fail(err.code || 'CONFIRM_FAILED', err.message || '결제 승인에 실패했습니다.');
      }

      document.querySelector('.result__icon').textContent = '✓';
      document.querySelector('.r-title').textContent = '결제가 완료되었습니다';
      document.querySelector('.result__msg').textContent = '주문해 주셔서 감사합니다.';
      document.querySelector('.r-order').textContent = payment.orderId;
      document.querySelector('.r-name').textContent = payment.orderName;
      document.querySelector('.r-method').textContent = payment.method || '-';
      document.querySelector('.r-amount').textContent = won(payment.totalAmount);
      document.querySelector('.r-date').textContent = formatDate(payment.approvedAt, true);
      if (payment.receiptUrl) {
        document.querySelector('.r-receipt').href = payment.receiptUrl;
        document.querySelector('.r-receipt-row').hidden = false;
      }
      document.querySelector('.result dl').hidden = false;
      document.querySelector('.result__btns').hidden = false;
      document.querySelector('.r-mypage').hidden = !payment.member;

      // 이 주문으로 처음 들어온 경우에만 장바구니 비우기
      if (pending && pending.orderId === orderId) {
        await Cart.synced;
        if (!pending.direct) Cart.clear();
        try {
          sessionStorage.removeItem('outfit_pending');
          sessionStorage.removeItem(ORDER_KEY);
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
